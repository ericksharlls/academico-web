<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Alunos</title>
    <link th:href="@{/css/estiloPaginaListagem.css}" rel="stylesheet" />
</head>
<body>
    <a href="/" class="estiloBotaoLink">Voltar para Página Inicial</a>

    <h2>Listagem de Alunos com informações de Curso</h2>

    <table class="tabela-listagem">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>Data de Nascimento</th>
                <th>Curso</th>
            </tr>
        </thead>
        <tbody>

                <tr th:each="aluno : ${alunosComCurso}">
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.matricula}"></td>
                    <td th:text="${aluno.dataNascimentoFormatada}"></td>
                    <td th:text="${aluno.nomeCurso}"></td>
                </tr>
            
        </tbody>
    </table>

</body>
</html>
