<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <h2>Exclusão de Aluno</h2>
        <form th:action="@{/alunos/excluir}" th:object="${aluno}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group" th:object="${aluno}">
                <label for="nome">Nome:</label>
                <span th:text="*{nome}" />
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula:</label>
                <span th:text="*{matricula}" />
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" th:field="*{dataNascimento}" disabled>
            </div>

            <div class="form-group">
                <input type="submit" value="Excluir">
               
                <a href="/alunos">
                    <input type="button" value="Cancelar">
                </a>
            </div>

        </form>
    </div>

</body>
</html>
