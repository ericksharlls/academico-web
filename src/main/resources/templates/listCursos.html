<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Alunos</title>
    <link th:href="@{/css/estiloPaginaListagem.css}" rel="stylesheet" />
</head>
<body>
    <a href="/" class="estiloBotaoLink">Voltar para Página Inicial</a>

    <br /><br />

    <div class="divMensagemSucesso" th:unless="${#strings.isEmpty(mensagemSucesso)}">
        <span th:text="*{mensagemSucesso}" />
    </div>

    <div class="divMensagemErro" th:unless="${#strings.isEmpty(mensagemErro)}">
        <span th:text="*{mensagemErro}" />
    </div>

    <h2>Listagem de Cursos</h2>

    <table class="tabela-listagem">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Sigla</th>
            </tr>
        </thead>
        <tbody>

                <tr th:each="curso : ${cursos}">
                    <td th:text="${curso.id}"></td>
                    <td th:text="${curso.nome}"></td>
                    <td th:text="${curso.sigla}"></td>
                </tr>
            
        </tbody>
    </table>

</body>
</html>
