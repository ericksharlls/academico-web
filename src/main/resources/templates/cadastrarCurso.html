<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Curso</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>


    <div class="container">
        <h2>Cadastro</h2>
        <form th:action="@{/cursos}" th:object="${curso}" method="post">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text"th:field="*{nome}">
            </div>

            <div class="form-group">
                <label for="sigla">Sigla:</label>
                <input type="text"th:field="*{sigla}">
            </div>

            <div class="form-group">
                <label for="dataFundacao">Data de Fundação</label>
                <input type="date" th:field="*{dataFundacao}">
            </div>

            <div class="form-group">
                <label for="emailCoordenacao">E-mail da Coordenação:</label>
                <input type="text"th:field="*{emailCoordenacao}">
            </div>

            <div class="form-group">
                <label for="telefoneCoordenacao">Telefone da Coordenação:</label>
                <input type="text"th:field="*{telefoneCoordenacao}">
            </div>

            <div class="form-group">
                <input type="submit" value="Enviar">
               
                <a href="/alunos">
                    <input type="button" value="Cancelar">
                </a>
            </div>

        </form>
    </div>

</body>
</html>
